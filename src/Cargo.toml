[package]
name = "pocket-modem"
version = "0.1.0"
edition = "2021"
authors = ["PocketModem Team"]
license = "GPL-3.0-or-later"
description = "GTK4 UI for PocketModem Radio - Native KV4P protocol"

[features]
default = ["notifications", "map"]
notifications = []
map = ["dep:libshumate"]

[dependencies]
serialport = "4.6"
glib = "0.22"
gio = "0.22"
gtk = { version = "0.11", package = "gtk4" }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7", "v1_4"] }
cairo-rs = "0.22"

# Map widget (uses libshumate for GTK4 map rendering)
# Enable v1_2 for VectorRenderer (vector tile support)
# This is optional - for Flatpak builds, libshumate is built from source
libshumate = { version = "0.8", features = ["v1_2"], optional = true }

# Image processing for APRS symbol spritesheets
image = "0.25"

# Desktop notifications
libnotify = "1.0"

# D-Bus for GeoClue2 location
zbus = { version = "5", features = ["tokio"] }
zvariant = { version = "4", default-features = false, features = ["default"] }

# HTTP client for tile downloading (rustls for TLS, no OpenSSL needed)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

# Serialization for settings
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0"

# UUID generation for unique message IDs
uuid = { version = "1.0", features = ["v4"] }

# Audio
cpal = "0.15"
rodio = "0.19"
opus = { version = "0.3", default-features = false }
oxideav-adpcm = "0.0.6"
oxideav-core = "0.1"
bytemuck = "1"

# Build utilities
cc = "1.0"

# Async runtime for audio
futures = "0.3"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }

# Ring buffer for audio buffering
ringbuf = "0.3"

[[bin]]
name = "pocket-modem"
path = "src/main.rs"