[package]
name = "pocket-modem"
version = "0.1.0"
edition = "2021"
authors = ["PocketModem Team"]
license = "GPL-3.0-or-later"
description = "GTK4 UI for PocketModem Radio - Native KV4P protocol"

[features]
default = ["notifications"]
notifications = []

[dependencies]
serialport = "4.6"
glib = "0.22"
gio = "0.22"
gtk = { version = "0.11", package = "gtk4" }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7", "v1_4"] }
cairo-rs = "0.22"

# Map widget (uses libshumate for GTK4 map rendering)
# Enable v1_2 for VectorRenderer (vector tile support)
libshumate = { version = "0.8", features = ["v1_2"] }

# Image processing for APRS symbol spritesheets
image = "0.25"
png = "0.17"

# Desktop notifications
libnotify = "1.0"

# HTTP client for tile downloading (rustls for TLS, no OpenSSL needed)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

# Serialization for settings
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0"

# UUID generation for unique message IDs
uuid = { version = "1.0", features = ["v4"] }

# Audio
cpal = "0.15"
rodio = "0.19"
opus = { version = "0.3", default-features = false }
oxideav-adpcm = "0.0.6"
oxideav-core = "0.1"
bytemuck = "1"

# Build utilities
cc = "1.0"

# Async runtime for audio
futures = "0.3"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }

# Ring buffer for audio buffering
ringbuf = "0.3"

# D-Bus for GeoClue2 location
zbus = { version = "5", features = ["tokio"] }
once_cell = "1.20"

# XDG Desktop Portal for location (Flatpak-compatible)
ashpd = { version = "0.8", default-features = false, features = ["tokio", "glib"] }

# RADAEv2 neural codec integration (workspace members for cross-platform builds)
rade = { path = "src/vendor/rade" }
lpcnet = { path = "src/vendor/lpcnet" }

[[bin]]
name = "pocket-modem"
path = "src/main.rs"

[[test]]
name = "aprs_parser_tests"
path = "tests/aprs_parser_tests.rs"