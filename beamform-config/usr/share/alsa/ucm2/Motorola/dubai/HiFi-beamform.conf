# Microphone Array Profile
# Combines Top Mic (Mic1/ADC1) and Bottom Mic (Mic3/ADC2) for beamforming

SectionVerb {
	EnableSequence [
		cset "name='SEN_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		# Enable both mics for dual mic input
		cset "name='ADC1 Switch' 1"
		cset "name='ADC2 Switch' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC2_MIXER Switch' 1"
	]

	DisableSequence [
		cset "name='SEN_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value.TQ "Voice"
}

SectionDevice."Speaker" {
	Comment "Speaker Playback"

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackVolume "Amplifier Playback Volume"
	}
}

SectionDevice."DualMic" {
	Comment "Dual Microphone Array"

	ConflictingDevice [
		"Mic1"
		"Mic3"
	]

	# Enable both analog mics
	Include.wcdmice1.File "/codecs/wcd937x/AnalogMic1EnableSeq.conf"
	Include.wcdmice3.File "/codecs/wcd937x/AnalogMic3EnableSeq.conf"

	# Enable SoundWire paths
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/SoundwireMic0EnableSeq.conf"
	Include.txmhpe2.File "/codecs/qcom-lpass/tx-macro/SoundwireMic4EnableSeq.conf"

	Include.wcdmicd1.File "/codecs/wcd937x/AnalogMic1DisableSeq.conf"
	Include.wcdmicd3.File "/codecs/wcd937x/AnalogMic3DisableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	EnableSequence [
		cset "name='TX_DEC0 Volume' 84"
		cset "name='TX_DEC1 Volume' 84"
		# Enable both ADCs
		cset "name='ADC1 Switch' 1"
		cset "name='ADC2 Switch' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC2_MIXER Switch' 1"
	]

	Value {
		CaptureChannels 2
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC1 ADC2"
		CaptureVolume "ADC1 Volume"
	}

	SectionSource."DualMic-source" {
		Comment "DualMic Stereo Source (2ch: FL=Top, FR=Bottom)"

		Device "DualMic"

		# Output is stereo - beamforming done in PipeWire
		Format "S16LE"
		Channels 2
		SampleRate 48000

		ConflictingDevice [
			"Mic1"
			"Mic3"
		]

		Priority 150
	}
}

# Keep individual mic devices for backward compatibility
SectionDevice."Mic1" {
	Comment "Top Microphone"

	ConflictingDevice [
		"Mic3"
	]

	Include.wcdmice.File "/codecs/wcd937x/AnalogMic1EnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd937x/AnalogMic1DisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/SoundwireMic0EnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	EnableSequence [
		cset "name='TX_DEC0 Volume' 84"
	]

	Value {
		CaptureChannels 1
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC1"
		CaptureVolume "ADC1 Volume"
	}
}

SectionDevice."Mic3" {
	Comment "Bottom Microphone"

	ConflictingDevice [
		"Mic1"
	]

	Include.wcdmice.File "/codecs/wcd937x/AnalogMic3EnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd937x/AnalogMic3DisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/SoundwireMic4EnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	EnableSequence [
		cset "name='TX_DEC1 Volume' 84"
	]

	Value {
		CaptureChannels 1
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC2"
		CaptureVolume "ADC2 Volume"
	}
}