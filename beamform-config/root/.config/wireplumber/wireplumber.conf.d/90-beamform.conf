# WirePlumber config to load WebRTC AEC with beamforming
# Requires: pipewire-echo-cancel package

context.modules = [
  # WebRTC AEC with beamforming for dual mic array
  {
    name = /usr/lib/pipewire-0.3/libpipewire-module-echo-cancel.so
    args = {
      # Use WebRTC AEC with beamforming enabled
      library.name = aec/libspa-aec-webrtc
      
      # WebRTC AEC arguments as key=value pairs
      aec.args = {
        beamforming = 1
        mic_geometry = "-0.075,0,0,0.075,0,0"
      }
      
      # Capture from hardware (dual mic stereo)
      capture.props = {
        node.name = "beamform_hw_capture"
        node.description = "Dual Mic Hardware Input"
        audio.position = [ FL, FR ]
        node.passive = true
      }
      
      # Beamformed mono output
      source.props = {
        node.name = "beamformed_mic"
        node.description = "Microphone Array"
        media.class = Audio/Source
        audio.position = [ MONO ]
      }
      
      # Echo reference sink
      sink.props = {
        node.name = "beamform_echo_sink"
        node.description = "Echo Cancellation Sink"
      }
      
      # Playback input for echo cancellation
      playback.props = {
        node.name = "beamform_echo_playback"
        node.passive = true
      }
    }
  }
]