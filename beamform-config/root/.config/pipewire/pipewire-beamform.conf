# Custom PipeWire config with WebRTC echo-cancel and beamforming
# Based on /usr/share/pipewire/pipewire.conf

context.properties = {
    log.level = 2
    # Other properties inherited from system config
}

context.spa-libs = {
    # SPA library locations
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
    aec.*           = aec/libspa-aec
}

context.modules = [
    # Realtime scheduling
    { name = libpipewire-module-rt
        args = {
            nice.level    = -11
            rt.prio       = 88
            rtportal.enabled = false
        }
        flags = [ ifexists nofail ]
    }

    # Native protocol
    { name = libpipewire-module-protocol-native }

    # Client node (for applications)
    { name = libpipewire-module-client-node }

    # Session manager
    { name = libpipewire-module-session-manager
        args = {
            # Enable sap for ip video
            # enable.sap = false
        }
    }

    # Echo cancellation with beamforming
    { name = libpipewire-module-echo-cancel
        args = {
            # Use WebRTC AEC with beamforming
            library.name = "aec/libspa-aec-webrtc"
            
            # WebRTC AEC Arguments
            # Enable beamforming and define mic positions
            # Motorola Edge 30 has mics ~15cm apart
            # Adjust positions: x=horizontal, y=depth, z=vertical
            aec.args = "beamforming=1 mic_geometry=-0.075,0,0,0.075,0,0"
            
            # Capture node (from hardware)
            capture.props = {
                node.name      = "beamform_hw_capture"
                node.description = "Dual Mic Hardware Input"
                audio.position = [ FL FR ]
                node.passive   = true
            }
            
            # Output node (beamformed mono)
            source.props = {
                node.name      = "beamformed_mic"
                node.description = "Microphone Array"
                media.class    = "Audio/Source"
                audio.position = [ MONO ]
                node.want-driver = false
            }
            
            # Sink for reference
            sink.props = {
                node.name      = "beamform_echo_sink"
                node.description = "Echo Cancellation Sink"
            }
            
            # Playback from apps
            playback.props = {
                node.name      = "beamform_echo_playback"
                node.passive   = true
            }
        }
    }
]