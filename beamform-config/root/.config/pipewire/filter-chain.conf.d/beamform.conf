# PipeWire Filter Chain: Delay-and-Sum Beamforming
# Input:  DualMic stereo (FL=Top Mic, FR=Bottom Mic)  
# Output: Mono beamformed signal
#
# This config defines a filter that applies delay-and-sum beamforming.
# Load with: pipewire -c filter-chain.conf

context.properties = {
    log.level = 2
}

context.modules = [
    { name = "libpipewire-module-filter-chain" }
]

filters = {
    # Delay-and-Sum Beamforming
    beamform-mono = {
        description = "Delay-and-Sum Beamforming for DualMic";
        type = "filter-chain";

        # Input/output format
        flags = [ "audio-only" ];

        # Match the DualMic source node
        node = {
            name = "alsa_input.platform-sound.*DualMic*"
        }

        # The filter graph
        chain = {
            nodes = {
                # Left channel gain (Top Mic)
                left = {
                    type = "ladspa";
                    plugin = "/usr/lib/ladspa/amp.so";
                    label = "amp_mono";
                    control = { gain = 0.5 };
                };

                # Right channel with delay (Bottom Mic)
                right = {
                    type = "ladspa";
                    plugin = "/usr/lib/ladspa/delay.so";
                    label = "delay_para";
                    control = {
                        "Delay (seconds)" = 0.00044;
                        "Feedback" = 0.0;
                        "Dry signal" = 0.0;
                        "Wet signal" = 1.0;
                    };
                };

                # Right gain stage
                right-gain = {
                    type = "ladspa";
                    plugin = "/usr/lib/ladspa/amp.so";
                    label = "amp_mono";
                    control = { gain = 0.5 };
                };
            };

            links = {
                # Left input -> left gain
                { input = "input:0"; output = "left:input" };
                # Right input -> delay -> right gain
                { input = "input:1"; output = "right:input" };
                { output = "right:output"; input = "right-gain:input" };
                # Both sum to mono output
                { output = "left:output"; input = "output:0" };
                { output = "right-gain:output"; input = "output:0" };
            };
        };
    };
}