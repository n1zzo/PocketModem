# PipeWire Filter Chain Config
# This config defines a delay-and-sum beamforming filter using LADSPA plugins

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
    ladspa.*        = ladspa/ladspa-sink
}

context.modules = [
    { name = libpipewire-module-filter-chain }
]

filters = {
    beamform = {
        description = "Delay and Sum Beamforming";
        type = filter-chain;

        # Match DualMic source
        filter.match = {
            node.name = "alsa_input.platform-sound.*DualMic*"
        }

        # Input: stereo (2 channels from dual mics)
        # Output: mono (beamformed)
        flags = [ audio-only ]

        chain = {
            nodes = [
                # Left channel gain (Top Mic)
                {
                    name = left_gain
                    type = ladspa
                    plugin = /usr/lib/ladspa/amp.so
                    label = amp_mono
                    control = { gain = 0.5 }
                }
                # Right channel delay (Bottom Mic) 
                {
                    name = right_delay
                    type = ladspa
                    plugin = /usr/lib/ladspa/delay.so
                    label = delay_5s
                    control = { "Delay (Seconds)" = 0.00044 }
                }
                # Right channel gain
                {
                    name = right_gain
                    type = ladspa
                    plugin = /usr/lib/ladspa/amp.so
                    label = amp_mono
                    control = { gain = 0.5 }
                }
            ]

            links = [
                # Left input -> left gain
                { output = "input:0"; input = "left_gain:input" }
                # Right input -> delay -> right gain
                { output = "input:1"; input = "right_delay:input" }
                { output = "right_delay:output"; input = "right_gain:input" }
                # Both sum to mono output
                { output = "left_gain:output"; input = "output:0" }
                { output = "right_gain:output"; input = "output:0" }
            ]
        }
    }
}