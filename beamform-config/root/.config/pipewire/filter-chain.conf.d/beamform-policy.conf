# WirePlumber node policy for beamforming
# Automatically applies the beamform-mono filter to DualMic source

context.spa-libs = {
    "support.node" = "support/libspa-node"
}

# Node policy: link DualMic source through beamform filter
policy.node = {
    default = [
        {
            name = "alsa_input.platform-sound.*DualMic*"
            filter = {
                factory = "filter-chain"
                library = "libfilter-chain"
                plugin = "/usr/lib/ladspa/amp.so"
                # The filter chain config defines the actual processing
            }
        }
    ]
}