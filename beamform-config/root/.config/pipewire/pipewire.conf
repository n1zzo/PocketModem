# Custom PipeWire config with echo-cancel module
# Copy of /usr/share/pipewire/pipewire.conf with echo-cancel added

context.properties = {
    link.max-buffers = 16
    core.daemon = true
    core.name = pipewire-0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    avb.*           = avb/libspa-avb
    api.alsa.*      = alsa/libspa-alsa
    api.v4l2.*      = v4l2/libspa-v4l2
    api.libcamera.* = libcamera/libspa-libcamera
    api.bluez5.*    = bluez5/libspa-bluez5
    api.vulkan.*    = vulkan/libspa-vulkan
    api.jack.*      = jack/libspa-jack
    support.*       = support/libspa-support
    video.convert.* = videoconvert/libspa-videoconvert
    audio.aec.webrtc = /usr/lib/spa-0.2/aec/libspa-aec-webrtc
}

context.modules = [
    { name = libpipewire-module-rt
      args = {
          nice.level    = -11
          rt.prio       = 88
      }
      flags = [ ifexists nofail ]
      condition = [ { module.rt = !false } ]
    }

    { name = libpipewire-module-protocol-native
        args = {
        }
    }

    { name = libpipewire-module-profiler
        args = {
        }
        condition = [ { module.profiler = !false } ]
    }

    { name = libpipewire-module-metadata
        condition = [ { module.metadata = !false } ]
    }

    { name = libpipewire-module-spa-device-factory
        condition = [ { module.spa-device-factory = !false } ]
    }

    { name = libpipewire-module-spa-node-factory
        condition = [ { module.spa-node-factory = !false } ]
    }

    { name = libpipewire-module-client-node
        condition = [ { module.client-node = !false } ]
    }

    { name = libpipewire-module-client-device
        condition = [ { module.client-device = !false } ]
    }

    { name = libpipewire-module-portal
        condition = [ { module.portal = !false } ]
    }

    { name = libpipewire-module-access
        condition = [ { module.access = !false } ]
    }

    { name = libpipewire-module-adapter
        condition = [ { module.adapter = !false } ]
    }

    { name = libpipewire-module-link-factory
        args = {
        }
        condition = [ { module.link-factory = !false } ]
    }

    { name = libpipewire-module-session-manager
        args = {
        }
        condition = [ { module.session-manager = !false } ]
    }

    { name = libpipewire-module-x11-bell
        args = {
        }
        flags = [ ifexists nofail ]
        condition = [ { module.x11.bell = !false } ]
    }

    { name = libpipewire-module-jackdbus-detect
        args = {
            jack.library     = libjack.so.0
            jack.server      = null
            jack.client-name = PipeWire
            jack.connect     = true
            tunnel.mode      = duplex
            source.props = {
                audio.channels = 2
            }
            sink.props = {
                audio.channels = 2
            }
        }
        flags = [ ifexists nofail ]
        condition = [ { module.jackdbus-detect = !false } ]
    }

    # WebRTC AEC with beamforming
    { name = libpipewire-module-echo-cancel
      args = {
          library.name = audio.aec.webrtc
          aec.args = "beamforming=1 mic_geometry=-0.075,0,0,0.075,0,0"
      }
    }
]