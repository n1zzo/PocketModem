# Add WebRTC echo-cancel module with beamforming to PipeWire
# This file is loaded as a drop-in via context.conf.d

context.modules += [
    # WebRTC AEC with beamforming
    { name = libpipewire-module-echo-cancel
      args = {
          # SPA library for WebRTC AEC
          library.name = "aec/libspa-aec-webrtc"
          
          # WebRTC Arguments
          # beamforming=1 enables the beamformer
          # mic_geometry: x,y,z in meters for each mic
          # Motorola Edge 30: mics ~15cm apart, top mic on left side
          aec.args = "beamforming=1 mic_geometry=-0.075,0,0,0.075,0,0"

          # Hardware capture (dual mic stereo input)
          capture.props = {
              node.name = "aec_capture"
              node.description = "Dual Mic Input"
              audio.position = [ FL, FR ]
              node.passive = true
          }
          
          # Beamformed mono output
          source.props = {
              node.name = "aec_source"
              node.description = "Microphone Array"
              media.class = "Audio/Source"
              audio.position = [ MONO ]
              node.want-driver = false
          }
          
          # Echo reference (playback from apps)
          sink.props = {
              node.name = "aec_sink"
              node.description = "Echo Cancellation Sink"
          }
          
          # Playback from apps
          playback.props = {
              node.name = "aec_playback"
              node.passive = true
          }
      }
    }
]